name: Solar-system Workflow
on:
    workflow_dispatch:
    push:
       branches:
        - main
        - 'feature/*'
env: 
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ VARS.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}       
        
jobs:
    unit-testing:
        name: Unit-Testing
        runs-on: ubuntu-latest
        # strategy:
        #     matrix:
        #         nodejs_version: [18,19,20]
        #         operating_system: [ubuntu-latest,macos-latest]
        #         exclude:
        #             - nodejs_version: 18
        #               operating_system: macos-latest
        # runs-on: ${{ matrix.operating_system }}
        steps:
            - name: checkout Repository
              uses: actions/checkout@v6
              
            - name: Setup NodeJs Version - 18
              uses: actions/setup-node@v6
              with:
                node-version: 18

            - name: Cache NPM dependicies
              uses: actions/cache@v5
              with:
                path: node_modules
                key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}   

            - name: Install Dependencies
              run: npm install
              
            - name: Unit Testing
              id: nodejs-unit-testing-step
              run: npm test 

            - name: Archive Test Results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: unit-test-results
                path: test-results.xml 
                retention-days: 1 
              
    code-coverage:
        name: Code-coverage
        runs-on: ubuntu-latest
        steps:
            - name: checkout Repository
              uses: actions/checkout@v6
              
            - name: Setup NodeJS Version - 18
              uses: actions/setup-node@v6
              with:
                node-version: 18

            - name: Cache NPM dependicies
              uses: actions/cache@v5
              with:
                path: node_modules
                key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}       
                
            - name: Install Dependencies
              run: npm install
              
            - name: Check Code Coverage
              continue-on-error: true
              run: npm run coverage
              
            - name: Archive Test Results
              uses: actions/upload-artifact@v7
              with:
                name: codecoverage-test-results
                path: coverage
                retention-days: 1

    docker:
        name: Containerization
        needs: [unit-testing, code-coverage]
        permissions: 
            packages: write
        runs-on: ubuntu-latest
        steps:
            - name: checkout Repo
              uses: actions/checkout@v6

            # - name: Login to ACR
            #   uses: docker/login-action@v4
            #   with:
            #    registry: <registry-name>.azurecr.io
            #    username: ${{ vars.AZURE_CLIENT_ID }}
            #    password: ${{ secrets.AZURE_CLIENT_SECRET }}  
              
            - name: Dockerhub Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}  

            - name: GHCR Login
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner}}
                password: ${{ secrets.GITHUB_TOKEN }}     
                
            - name: Docker Build 
              uses: docker/build-push-action@v7
              with:
               context: .
               push: false
               tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }} 
               
            - name: Docket Image Test
              run: | 
                docker images
                docker run --name solar-system-app -d \
                    -p 3000:3000 \
                    -e MONGO_URI=$MONGO_URI \
                    -e MONGO_USERNAME=$MONGO_USERNAME \
                    -e MONGO_PASSWORD=$MONGO_PASSWORD \
                    ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

                export IP=$(docker inspect -f '{{ range .NetworkSettings.Networks }}{{ .IPAddress}}{{ end}}' solar-system-app)
                echo $IP
                 
                echo Testing image URL using wget
                wget -q -O - 127.0.0.1:3000/live | grep live

            - name: container Registry push
              uses: docker/build-push-action@v7
              with:
               context: .
               push: true
               tags: |
                ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}  
                ghcr.io/${{ github.repository_id }}/solar-system:${{ github.sha }}  







          


